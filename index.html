<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      padding: 28px 24px 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: 2px solid #4f46e5;
      border-color: #4f46e5;
    }

    button {
      border: none;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 2px;
    }

    .add-button {
      padding: 12px 16px;
      background: #4f46e5;
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
    }

    .add-button:hover {
      background: #4338ca;
    }

    .message {
      margin: 12px 0 0;
      min-height: 1.25rem;
      font-size: 0.95rem;
    }

    .error {
      color: #b91c1c;
    }

    .empty {
      margin: 20px 0 0;
      padding: 18px;
      text-align: center;
      color: #6b7280;
      background: #f8fafc;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
    }

    .task-list {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .task.completed .task-text {
      color: #6b7280;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 8px 12px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.9rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .delete-button:hover {
      background: #fecaca;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .app {
        padding: 20px 16px;
      }

      form {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="What do you need to do?"
        aria-label="New task"
        autocomplete="off"
      >
      <button class="add-button" type="submit">Add Task</button>
    </form>

    <p id="error-message" class="message error" hidden></p>
    <p id="empty-message" class="empty">No tasks yet. Add one above to get started.</p>
    <ul id="task-list" class="task-list"></ul>
  </main>

  <script>
    const STORAGE_KEY = "todo-tasks";

    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const emptyMessage = document.getElementById("empty-message");
    const errorMessage = document.getElementById("error-message");

    let tasks = loadTasks();

    // Read saved tasks. If storage is blocked or the data is broken, start fresh.
    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          return [];
        }

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed.filter(function (task) {
          return task && typeof task.id === "string" && typeof task.text === "string";
        });
      } catch (error) {
        console.error("Could not load tasks:", error);
        return [];
      }
    }

    // Save the current list. The app still works if the browser refuses to store it.
    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (error) {
        console.error("Could not save tasks:", error);
        showError("Tasks work for now, but this browser could not save them.");
        return false;
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.hidden = false;
    }

    function clearError() {
      errorMessage.textContent = "";
      errorMessage.hidden = true;
    }

    function renderTasks() {
      list.innerHTML = "";
      emptyMessage.hidden = tasks.length > 0;

      tasks.forEach(function (task) {
        const item = document.createElement("li");
        item.className = "task";
        if (task.completed) {
          item.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(task.completed);
        checkbox.setAttribute("aria-label", "Mark task as completed: " + task.text);
        checkbox.addEventListener("change", function () {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete task: " + task.text);
        deleteButton.addEventListener("click", function () {
          tasks = tasks.filter(function (current) {
            return current.id !== task.id;
          });
          saveTasks();
          renderTasks();
        });

        item.appendChild(checkbox);
        item.appendChild(text);
        item.appendChild(deleteButton);
        list.appendChild(item);
      });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) {
        showError("Please enter a task before adding it.");
        input.focus();
        return;
      }

      clearError();
      tasks.push({
        id: Date.now().toString(),
        text: text,
        completed: false
      });
      input.value = "";
      saveTasks();
      renderTasks();
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
